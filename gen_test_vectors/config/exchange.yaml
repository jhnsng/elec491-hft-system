# Exchange Layer Configuration
# Produces ITCH 5.0 length-prefixed binary stream format (ITCHStream wire format):
#   [2-byte big-endian length][ITCH message body]

# Layer identifier
layer: exchange

# Parse sheets in this exact top-down order.
sheet_names:
  - F001_Warmup
  - F003_LowerBaseline
  - F003_UPCross
  - F003_UPCrossHold
  - F004_UpperBaseline
  - F004_DownCross
  - F004_DownCrossHold
  - F005_ResetMid
  - F005_UPCrossBlocked
  - F006_ResetMid
  - F006_CrossedQuotes
  - F007_ResetMid
  - F007_UPReject
  - F007_UPRejectHold
  - F008_ResetMid
  - F008_Cross1_Backpressure
  - F008_Cross1_BackpressureHold
  - F008_Cross2_Backpressure
  - F008_Cross2_BackpressureHold
  - F008_Cross3_Backpressure
  - F008_Cross3_BackpressureHold
  - F008_Cross4_Backpressure
  - F008_Cross4_BackpressureHold
  - F008_Cross5_Backpressure
  - F008_Cross5_BackpressureHold
  - F008_Cross6_Backpressure
  - F008_Cross6_BackpressureHold
  - F008_Cross7_Backpressure
  - F008_Cross7_BackpressureHold
  - F008_Cross8_Backpressure
  - F008_Cross8_BackpressureHold
  - F008_Cross9_Backpressure
  - F008_Cross9_BackpressureHold
  - F008_Cross10_Backpressure
  - F008_Cross10_BackpressureHold
  - F008_Cross11_Backpressure
  - F008_Cross11_BackpressureHold
  - F008_Cross12_Backpressure
  - F008_Cross12_BackpressureHold
  - F008_Cross13_Backpressure
  - F008_Cross13_BackpressureHold
  - F008_Cross14_Backpressure
  - F008_Cross14_BackpressureHold
  - F008_Cross15_Backpressure
  - F008_Cross15_BackpressureHold
  - F008_Cross16_Backpressure
  - F008_Cross16_BackpressureHold
  - F008_Cross17_Backpressure
  - F008_Cross17_BackpressureHold
  - F008_Cross18_Backpressure
  - F008_Cross18_BackpressureHold
  - F009_ResetMid
  - F009_PartialFill
  - F009_PartialFillHold

# Columns to parse from Excel
columns:
  - Message Type
  - Timestamp
  - Order ID
  - Side
  - Shares
  - Stock
  - Price

# Optional columns to parse when present
optional_columns:
  - Attribution

# Data type specifications for each column
data_types:
  Order ID: int
  Shares: int
  Price: float
  Message Type: str
  Side: str
  Stock: str
  Attribution: str

output:
  combine_sheets: true
  summary_filename: exchange_sheet_message_counts.txt
