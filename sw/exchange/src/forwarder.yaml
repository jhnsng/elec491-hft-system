udp:
  host: 192.168.1.123
  port: 12345
  session: ITCH_DATA
  max_packet_size: 1460

reader:
  chunk_size: 4194304  # 4 MiB
  max_buffer_mb: 512
  stats_interval: 5.0
  benchmark_timeout_s: 60.0
  # preload_bytes: 1073741824    # 1 GiB

replay:
  enabled: true
  # start_timestamp: 34200000000000      # nanoseconds since midnight
  start_time_24h: "09:30:00.000000"    # market-day time, no timezone conversion
  speed: 1.0

tickers:
  - SPY
#  - AAPL
#  - MSFT

ouch:
  host: 0.0.0.0
  port: 9000
  enabled: false         # opt-in; override with --ouch CLI flag

orderbook:
  max_orders: 5000000
  snapshot_interval_s: 0.25
  snapshot_depth: 10
  snapshot_path: ./orderbook_snapshot.json

order_id_rewrite:
  enabled: true
  start_id: 1
